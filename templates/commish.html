{% extends "base.html" %}
{% block content %}
<h2>Commish</h2>
<div class="card">
  <table>
    <tr><th>Name</th><th>Team</th><th></th></tr>
    {% for member in members %}
    <tr>
      <td>{{ member['name'] }}</td>
      <td>{% if member['unlocked'] %}Reopened{% elif member['submitted'] %}Team in{% else %}Not yet{% endif %}</td>
      <td class="num">
        <form class="inline" method="post" action="{{ url_for('commish_unlock', user_id=member['id']) }}">
          <input type="hidden" name="csrf" value="{{ csrf_token() }}">
          <button class="small">Reopen team</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </table>
</div>
<div class="card">
  <form method="post" action="{{ url_for('commish_add') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="name">Add a person</label>
    <input id="name" name="name" maxlength="30" required>
    <button class="primary">Add</button>
  </form>
  <p class="muted">They log in by typing that name.</p>
</div>
{% endblock %}
