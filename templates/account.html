{% extends "base.html" %}
{% block content %}
<h2>{% if user['must_change'] %}Choose your name and password{% else %}Your account{% endif %}</h2>
<div class="card">
  {% if user['must_change'] %}<p class="muted">Set your own password before you pick your team.</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="name">Name</label>
    <input id="name" name="name" value="{{ request.form.get('name', user['name']) }}" maxlength="30" autocomplete="username" required>
    <label for="password">New password</label>
    <input id="password" name="password" type="password" minlength="4" autocomplete="new-password" required>
    <label for="confirm">New password again</label>
    <input id="confirm" name="confirm" type="password" minlength="4" autocomplete="new-password" required>
    <button class="primary">Save</button>
  </form>
</div>
{% endblock %}
