{% extends "base.html" %}
{% block content %}
<h2>Who are you?</h2>
<div class="card">
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="name">Your name</label>
    <input id="name" name="name" maxlength="30" autocomplete="off" autocapitalize="words" autofocus required>
    <button class="primary">Go to my team</button>
  </form>
  <p class="muted">Type the same name each time to get back to your team. A new name starts a new team.</p>
</div>
{% endblock %}
